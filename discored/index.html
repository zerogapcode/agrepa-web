<!doctype html>
<html lang="es-VE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DISCORED // 7.3TB — Acceso Privado | Agrepa Asfalcem</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#0B0B0C">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root {
  --asfalto: #0B0B0C;
  --superficie: #141416;
  --borde: #26262A;
  --ambar: #F6B10B;
  --ambar-claro: #FFD24A;
  --ambar-oscuro: #D1930A;
  --texto: #F2F0ED;
  --texto-2: #C7C4BF;
  --texto-3: #9A9894;
}
*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--asfalto);
  color: var(--texto);
  font-family: 'Barlow', 'Helvetica Neue', Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.franja {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 6px;
  background: repeating-linear-gradient(135deg, var(--ambar) 0 14px, var(--asfalto) 14px 28px);
  z-index: 20;
}
.contenedor {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.panel {
  width: 100%;
  max-width: 440px;
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-top: 4px solid var(--ambar);
  padding: 36px 32px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75);
}
.lbl {
  font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--ambar);
  margin-bottom: 8px;
}
h1 {
  margin: 0 0 12px;
  font-family: 'Archivo Black', 'Arial Black', Impact, sans-serif;
  font-weight: 400;
  font-size: 1.85rem;
  line-height: 1.05;
  text-transform: uppercase;
  letter-spacing: -0.015em;
}
p {
  margin: 0 0 24px;
  color: var(--texto-3);
  font-size: 0.95rem;
  line-height: 1.5;
}
.estado {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--asfalto);
  border: 1px solid var(--borde);
  border-left: 3px solid var(--ambar);
  font-family: 'Barlow Condensed', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-size: 0.9rem;
  color: var(--texto-2);
  margin-bottom: 20px;
}
.pulso {
  width: 10px;
  height: 10px;
  background: var(--ambar);
  border-radius: 50%;
  animation: latido 1.1s infinite ease-in-out;
}
@keyframes latido {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(0.85); }
}
.acciones {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 50px;
  padding: 14px 22px;
  font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.13em;
  font-weight: 700;
  font-size: 0.92rem;
  text-decoration: none;
  border: 1px solid transparent;
  cursor: pointer;
}
.btn--primario {
  color: var(--asfalto);
  background: linear-gradient(180deg, var(--ambar-claro) 0%, var(--ambar) 52%, var(--ambar-oscuro) 100%);
  box-shadow: 0 12px 30px rgba(246, 177, 11, 0.2);
}
.btn--linea {
  color: var(--texto);
  border-color: #3A3A3F;
  background: transparent;
}
.btn--linea:hover {
  border-color: var(--ambar);
  color: var(--ambar);
}
</style>
</head>
<body>
<div class="franja"></div>
<main class="contenedor">
  <section class="panel">
    <div class="lbl">INFRAESTRUCTURA DE DATOS // ACCESO PRIVADO</div>
    <h1>DISCORED // 7.3TB</h1>
    <p>Conectando de forma segura con la unidad central de almacenamiento.</p>
    <div class="estado">
      <span class="pulso"></span>
      <span id="txt-estado">CONECTANDO CON EL SERVIDOR…</span>
    </div>
    <div class="acciones">
      <a id="btn-cloud" class="btn btn--primario" href="https://skirt-dist-paid-become.trycloudflare.com/login">ENTRAR VÍA CLOUD HTTPS</a>
      <a id="btn-lan" class="btn btn--linea" href="http://192.168.1.167:8080/login">ENTRAR EN RED LOCAL (LAN)</a>
    </div>
  </section>
</main>
<script>
(async function () {
  const txt = document.getElementById('txt-estado');
  const btnCloud = document.getElementById('btn-cloud');
  let cloudUrl = 'https://skirt-dist-paid-become.trycloudflare.com';
  try {
    const res = await fetch('/discored/endpoint.json?t=' + Date.now(), { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      if (data && data.url) {
        cloudUrl = data.url.replace(/\/+$/, '');
        btnCloud.href = cloudUrl + '/login';
      }
    }
  } catch (_) {}

  txt.textContent = 'REDIRIGIENDO A DISCORED // 7.3TB…';
  window.location.replace(cloudUrl + '/login');
})();
</script>
</body>
</html>
